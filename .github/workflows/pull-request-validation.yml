name: "0. [Auto] Pull Request Validation"

# Gate: require this check on develop before merge.
# Deploy workflows build again; they must not be the only quality gate.
on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pull-request-validation:
    name: Pull Request Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Placeholder only for PR gate; deploy workflows bake the real API URL.
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
